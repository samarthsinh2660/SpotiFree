# /etc/nginx/sites-available/spotifree
# A NEW file — do not edit the block serving billappreward.sbs.
# The app runs in Docker, published on 127.0.0.1:3001.
# certbot rewrites this to add the TLS listener and cert paths.

server {
    listen 80;
    listen [::]:80;
    server_name spotifree.billappreward.sbs;

    # Let's Encrypt must reach this path unauthenticated, otherwise the HTTP-01
    # challenge gets a 401 from the password gate below and issuance fails.
    # `^~` stops nginx evaluating other location blocks for this prefix.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        allow all;
        root /var/www/html;
    }

    # Password gate: without it, any visitor spends your YouTube quota.
    auth_basic           "Spotifree";
    auth_basic_user_file /etc/nginx/.htpasswd-spotifree;

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
