# /etc/nginx/sites-available/spotifree
# A NEW file — do not edit the server block serving billappreward.sbs.
# certbot rewrites this to add the TLS listener and cert paths.
# The app runs in Docker, published on 127.0.0.1:3001.

server {
    listen 80;
    listen [::]:80;
    server_name spotifree.billappreward.sbs;

    # Password gate: without it, any visitor spends your YouTube quota.
    auth_basic           "Spotifree";
    auth_basic_user_file /etc/nginx/.htpasswd-spotifree;

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
