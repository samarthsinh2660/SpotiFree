<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotifree</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="shell">
  <header class="hero">
    <div class="brand">
      <svg viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.5 17.3a.75.75 0 0 1-1.03.25c-2.82-1.72-6.37-2.11-10.56-1.15a.75.75 0 1 1-.33-1.46c4.58-1.05 8.51-.6 11.67 1.33.35.22.46.68.25 1.03zm1.47-3.27a.94.94 0 0 1-1.29.31c-3.23-1.98-8.15-2.56-11.97-1.4a.94.94 0 1 1-.54-1.8c4.36-1.32 9.78-.68 13.49 1.6.44.27.58.85.31 1.29zm.13-3.4C15.23 8.33 8.9 8.12 5.2 9.24a1.12 1.12 0 1 1-.65-2.15c4.24-1.29 11.23-1.04 15.66 1.59a1.12 1.12 0 0 1-1.15 1.93z"/></svg>
      Spotifree
    </div>
    <h1>Your playlists, without the ads.</h1>
    <p class="sub">Paste a public Spotify playlist link. Tracks are matched to YouTube once, then cached forever.</p>

    <form class="loader" id="loader">
      <input type="text" id="url" placeholder="https://open.spotify.com/playlist/…" autocomplete="off" spellcheck="false">
      <button class="primary" type="submit" id="load">Load</button>
    </form>
  </header>

  <div class="notice" id="notice"></div>

  <section class="listing" id="listing" hidden>
    <div class="listing-head">
      <h2 id="plName"></h2>
      <span class="quota" id="quota"></span>
    </div>
    <div id="rows"></div>
  </section>
</div>

<div id="stage"><div id="host"></div></div>

<footer class="dock">
  <div class="now">
    <div class="art" id="nowArt"></div>
    <div class="meta">
      <div class="t" id="nowTitle">Nothing playing</div>
      <div class="a" id="nowArtist">—</div>
    </div>
  </div>

  <div class="controls">
    <div class="buttons">
      <button class="ctl" id="shuffle" title="Shuffle (s)">
        <svg viewBox="0 0 16 16"><path d="M13.15 2.35a.5.5 0 0 0-.7.7L13.29 4H12c-1.7 0-2.7.9-3.5 2l-.4.6.6.9.6-.9C10.1 5.5 10.8 5 12 5h1.29l-.84.85a.5.5 0 0 0 .7.7l1.71-1.7a.5.5 0 0 0 0-.71l-1.71-1.7zM2 4h1.5c1.2 0 1.9.5 2.6 1.6l3 4.5C9.9 11.3 10.9 12 12.5 12h.79l-.84.85a.5.5 0 0 0 .7.7l1.71-1.7a.5.5 0 0 0 0-.71l-1.71-1.7a.5.5 0 0 0-.7.7l.84.86h-.79c-1.2 0-1.9-.5-2.6-1.6l-3-4.5C6.1 3.7 5.1 3 3.5 3H2v1zm0 7h1.5c1 0 1.6-.35 2.2-1.1l.5-.75-.6-.9-.6.9C4.6 9.7 4.2 10 3.5 10H2v1z"/></svg>
      </button>
      <button class="ctl" id="prev" title="Previous">
        <svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM13 2v12L5.5 8z"/></svg>
      </button>
      <button class="ctl play" id="play" title="Play / pause (space)">
        <svg viewBox="0 0 16 16" id="playIcon"><path d="M3 1.7v12.6L14 8z"/></svg>
      </button>
      <button class="ctl" id="next" title="Next (n)">
        <svg viewBox="0 0 16 16"><path d="M11 2h2v12h-2zM3 2v12L10.5 8z"/></svg>
      </button>
      <button class="ctl" id="video" title="Show video">
        <svg viewBox="0 0 16 16"><path d="M1 3h11v10H1zM13 6l2-1.5v7L13 10z"/></svg>
      </button>
    </div>

    <div class="scrub">
      <span class="time" id="elapsed">0:00</span>
      <div class="track" id="bar"><div class="fill" id="fill"></div></div>
      <span class="time" id="total">0:00</span>
    </div>
  </div>

  <div class="right">
    <input class="vol" type="range" id="vol" min="0" max="100" value="80" title="Volume">
  </div>
</footer>

<script src="/app.js"></script>
</body>
</html>
